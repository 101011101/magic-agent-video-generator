<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent vs MCP</title>
<style>
:root{color-scheme:light;--bg:#f6f6f4;--surface:#fcfcfb;--sunken:#efefec;--line:#dededa;--ink:#0b0b0b;--ink2:#52514e;--ink3:#74736e;--agent:#2a78d6;--mcp:#eb6834;--tie:#a3a29c;--on:#0b0b0b;--on-ink:#fcfcfb}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#121211;--surface:#1a1a19;--sunken:#242422;--line:#34342f;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#9a9990;--agent:#3987e5;--mcp:#d95926;--tie:#74736e;--on:#f0efec;--on-ink:#1a1a19}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
h1{font-size:24px;line-height:1.2;margin:28px 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink2);margin:0 0 20px;max-width:78ch}
button{font:inherit;color:inherit;cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.d-agent{background:var(--agent)}.d-mcp{background:var(--mcp)}.d-tie{background:var(--tie)}

.overview{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel h2{font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 10px}
.stat{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.stat th{font-weight:500;text-align:right;color:var(--ink2);padding:0 0 6px 10px;font-size:12px}
.stat td{padding:4px 0 4px 10px;text-align:right;border-top:1px solid var(--line)}
.stat td:first-child{text-align:left;padding-left:0;color:var(--ink2)}
.stat td.w{font-weight:600}
.note{color:var(--ink3);font-size:12px;margin:10px 0 0}

.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:8px;flex-wrap:wrap}
.bars{display:grid;grid-template-columns:minmax(150px,190px) 1fr auto;grid-auto-flow:row dense;gap:3px 12px;align-items:center}
.bars .name{grid-column:1}.bars .bar{grid-column:2}.bars .tally{grid-column:3}
.bars .name{background:none;border:0;padding:3px 6px;margin-left:-6px;text-align:left;border-radius:6px;font-size:13px}
.bars .name:hover{background:var(--sunken)}.bars .name.on{background:var(--on);color:var(--on-ink)}
.bar{display:flex;gap:2px;height:16px}
.bar button{border:0;padding:0;min-width:3px;background:var(--c);transition:opacity .12s}
.bar button:first-child{border-radius:4px 0 0 4px}.bar button:last-child{border-radius:0 4px 4px 0}.bar button:only-child{border-radius:4px}
.bar button.dim{opacity:.22}.bar button:hover{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.tally{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:4px 8px;border-radius:6px;display:none;max-width:280px}

.controls{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.row{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center}.row+.row{margin-top:8px}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:5px 12px;font-weight:500;white-space:nowrap}
.seg button .n{color:var(--ink3);font-weight:400;margin-left:5px;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}.seg button.on .n{color:var(--ink2)}
.seg button:disabled{opacity:.45;cursor:default}
.seg.small button{padding:2px 9px;font-size:12.5px}
.lab{font-size:12px;color:var(--ink2);margin-right:5px}
.field{display:inline-flex;align-items:center}
input[type=search],select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 9px}
input[type=search]{width:200px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.link{background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;font-size:12.5px}
.showing{margin-left:auto;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.head{display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap}
.id{font:12px ui-monospace,Menlo,monospace;color:var(--ink3)}
.title{font-weight:600;font-size:15px}
.badge{font-weight:600;font-size:13px;white-space:nowrap}
.meta{color:var(--ink3);font-size:12px}
.prompt{margin:8px 0 10px;padding:7px 11px;background:var(--sunken);border-radius:7px;white-space:pre-wrap;overflow-wrap:anywhere}
.prompt .msg+.msg{margin-top:5px}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.atts img{height:54px;border-radius:4px;display:block}
.flag{border-left:3px solid var(--ink3);padding:3px 10px;font-size:12.5px;color:var(--ink2);margin:0 0 10px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.side{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.side.won{border-top:3px solid var(--s)}
.side-agent{--s:var(--agent)}.side-mcp{--s:var(--mcp)}
.sname{display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:7px}
.sname .won-tag{font-size:12px;font-weight:500;color:var(--ink2)}
.media{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:8px}
.media a{display:block}
.media img,.media video{display:block;width:100%;max-height:340px;object-fit:contain;background:var(--sunken);border-radius:6px;min-height:120px}
.media audio{width:100%;grid-column:1/-1}
.none{background:var(--sunken);border-radius:6px;padding:9px 11px;margin-bottom:8px;color:var(--ink2);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:190px;overflow:auto}
.none b{color:var(--ink);display:block;margin-bottom:2px}
.nums{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-bottom:5px}
.nums b{color:var(--ink);font-weight:600}
.summary{font-size:13px;margin:5px 0}
.tags{font-size:12px;color:var(--ink2);margin:5px 0}
.complaint{font-size:13px;margin:6px 0 0;color:var(--ink2)}
.complaint span{color:var(--ink);font-weight:500}
details{margin-top:8px;font-size:12.5px}
summary{cursor:pointer;color:var(--ink2)}
.steps{list-style:none;margin:7px 0 0;padding:0}
.steps li{padding:6px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.steps code{font:12px ui-monospace,Menlo,monospace}
.steps p{margin:3px 0 0;color:var(--ink2)}
.why{margin:10px 0 0;padding-top:9px;border-top:1px solid var(--line);font-size:13.5px}
.why .key{display:block;font-size:12px;color:var(--ink3);margin-top:3px}
.empty{text-align:center;color:var(--ink2);padding:60px 0}
footer{color:var(--ink3);font-size:12px;padding:10px 0 40px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--agent);outline-offset:2px}
@media (max-width:820px){
  .wrap{padding:0 16px}.overview{grid-template-columns:minmax(0,1fr)}
  .sides{grid-template-columns:minmax(0,1fr)}
  .bars{grid-template-columns:minmax(0,1fr) auto}.bars .tally{grid-column:2}.bars .bar{grid-column:1/-1;margin-bottom:6px}
  .controls{position:static}.showing{margin-left:0}
  .seg{display:flex;flex-wrap:wrap}.seg button{flex:1}
  input[type=search]{width:100%}.field{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Our agent vs the Magic Hour MCP</h1>
  <p class="sub" id="sub"></p>
  <section class="overview">
    <div class="panel"><h2 id="stat-title"></h2><table class="stat" id="stats"></table><p class="note" id="how-note"></p></div>
    <div class="panel"><h2>Who won, by category</h2>
      <div class="legend"><span><i class="dot d-agent"></i>Agent wins</span><span><i class="dot d-tie"></i>Tie</span><span><i class="dot d-mcp"></i>MCP wins</span></div>
      <div class="bars" id="bars"></div>
    </div>
  </section>
  <section class="controls">
    <div class="row">
      <div class="seg" id="winner" role="group" aria-label="Filter by winner"></div>
      <span class="showing" id="showing"></span>
    </div>
    <div class="row">
      <span class="field"><span class="lab">Margin</span><span class="seg small" id="margin"></span></span>
      <span class="field"><span class="lab">Decided by</span><span class="seg small" id="how"></span></span>
      <label class="check" title="The winner failed the grader's checks while the loser passed them"><input type="checkbox" id="disagree"> Judge and grader disagree</label>
      <input type="search" id="q" placeholder="Search prompt, title, id" aria-label="Search items">
      <span class="field"><span class="lab">Sort</span><select id="sort" aria-label="Sort"><option value="id">Item order</option><option value="gap">Biggest score gap</option><option value="credits">Most credits</option></select></span>
      <button class="link" id="reset">Clear filters</button>
    </div>
  </section>
  <main id="list"></main>
  <footer id="foot"></footer>
</div>
<div id="tip" role="tooltip"></div>
<script id="data" type="application/json">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent), R = D.rows;
const $ = (id) => document.getElementById(id);
const esc = (x) => String(x ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const WHO = { agent: "Agent", mcp: "MCP" };
const WIN = { all: "All", agent: "Agent wins", mcp: "MCP wins", tie: "Ties" };
const HOW = { all: "Any", judge: "Judge, both compared", made: "Only one delivered", score: "Grader score" };
const MARGIN = { all: "Any", clear: "Clear", slight: "Slight" };
const DEFAULT = { w: "all", g: "all", m: "all", h: "all", x: false, q: "", s: "id" };
let F = { ...DEFAULT };

const disagrees = (r) => { const w = r.verdict.winner; if (w === "tie") return false; const l = w === "agent" ? "mcp" : "agent"; return !r[w].pass && r[l].pass; };
const haystack = new Map(R.map((r) => [r, [r.id, r.title, r.tests, ...r.prompt].join(" ").toLowerCase()]));
// every filter except the one named, so a control's counts say what choosing that option would show
const match = (r, skip) =>
  (skip === "w" || F.w === "all" || r.verdict.winner === F.w) &&
  (skip === "g" || F.g === "all" || r.group === F.g) &&
  (skip === "m" || F.m === "all" || r.verdict.margin === F.m) &&
  (skip === "h" || F.h === "all" || r.verdict.how === F.h) &&
  (skip === "x" || !F.x || disagrees(r)) &&
  (!F.q || haystack.get(r).includes(F.q.toLowerCase()));

function seg(el, options, value, key, counter) {
  el.innerHTML = Object.entries(options).map(([k, label]) => {
    const n = counter(k);
    return `<button data-k="${k}" class="${value === k ? "on" : ""}" aria-pressed="${value === k}"${n === 0 && value !== k ? " disabled" : ""}>${k === "agent" || k === "mcp" || k === "tie" ? `<i class="dot d-${k}"></i>` : ""}${esc(label)}<span class="n">${n}</span></button>`;
  }).join("");
  el.querySelectorAll("button").forEach((b) => b.onclick = () => { F[key] = b.dataset.k; update(); });
}

function bars() {
  // the bars keep all three outcomes and every category visible: they ignore those two filters and dim what the winner filter leaves out
  const ignoringGroup = R.filter((r) => (F.m === "all" || r.verdict.margin === F.m) && (F.h === "all" || r.verdict.how === F.h) && (!F.x || disagrees(r)) && (!F.q || haystack.get(r).includes(F.q.toLowerCase())));
  $("bars").innerHTML = Object.entries(D.names).map(([g, name]) => {
    const rows = ignoringGroup.filter((r) => r.group === g), n = rows.length;
    const c = { agent: 0, tie: 0, mcp: 0 }; rows.forEach((r) => c[r.verdict.winner]++);
    const segs = ["agent", "tie", "mcp"].filter((k) => c[k]).map((k) => `<button style="flex:${c[k]} 1 0;--c:var(--${k})" class="${F.w !== "all" && F.w !== k ? "dim" : ""}" data-g="${g}" data-w="${k}" data-tip="${esc(name)}: ${c[k]} of ${n} ${k === "tie" ? "tied" : WHO[k] + " won"}" aria-label="${esc(name)}, ${WIN[k]}: ${c[k]}"></button>`).join("");
    return `<button class="name ${F.g === g ? "on" : ""}" data-g="${g}" aria-pressed="${F.g === g}">${esc(name)}</button><span class="tally">${c.agent} · ${c.tie} · ${c.mcp}</span><div class="bar">${segs}</div>`;
  }).join("");
  $("bars").querySelectorAll(".name").forEach((b) => b.onclick = () => { F.g = F.g === b.dataset.g ? "all" : b.dataset.g; update(); });
  $("bars").querySelectorAll(".bar button").forEach((b) => {
    b.onclick = () => { const same = F.g === b.dataset.g && F.w === b.dataset.w; F.g = same ? "all" : b.dataset.g; F.w = same ? "all" : b.dataset.w; update(); };
    b.onmousemove = (e) => { const t = $("tip"); t.textContent = b.dataset.tip; t.style.display = "block"; t.style.left = Math.min(e.clientX + 12, innerWidth - 290) + "px"; t.style.top = e.clientY + 14 + "px"; };
    b.onmouseleave = () => { $("tip").style.display = "none"; };
  });
}

function stats(rows) {
  const n = rows.length, sum = (f) => rows.reduce((a, r) => a + (f(r) || 0), 0);
  const both = (label, f, fmt = (x) => x) => { const a = f("agent"), m = f("mcp"); return `<tr><td>${label}</td><td>${fmt(a)}</td><td>${fmt(m)}</td></tr>`; };
  $("stat-title").textContent = n === R.length ? `All ${n} items` : `These ${n} items`;
  $("stats").innerHTML = `<tr><th></th><th>Agent</th><th>MCP</th></tr>` +
    both("Passed grader", (s) => rows.filter((r) => r[s].pass).length) +
    both("Mean score", (s) => n ? Math.round(sum((r) => r[s].score) / n) : "–") +
    both("Delivered a file", (s) => rows.filter((r) => r[s].outputs.length).length) +
    both("Credits", (s) => sum((r) => r[s].spent).toLocaleString()) +
    both("Minutes", (s) => Math.round(sum((r) => r[s].seconds) / 60).toLocaleString());
  const w = (k, h) => rows.filter((r) => r.verdict.winner === k && r.verdict.how === h).length;
  const parts = [];
  if (w("agent", "made")) parts.push(`${w("agent", "made")} agent wins came because the MCP delivered nothing`);
  if (w("mcp", "made")) parts.push(`${w("mcp", "made")} MCP wins came because the agent delivered nothing`);
  const scored = w("agent", "score") + w("mcp", "score");
  if (scored) parts.push(`${scored} ${scored === 1 ? "win was" : "wins were"} settled on grader score, without the judge`);
  $("how-note").textContent = parts.length ? parts.join("; ") + "." : "";
}

const media = (p) => {
  const u = "../../../../" + p.split("/").map(encodeURIComponent).join("/");
  if (/\.(png|jpe?g|webp)$/i.test(p)) return `<a href="${u}" target="_blank" rel="noopener"><img loading="lazy" src="${u}" alt="Output ${esc(p.split("/").pop())}"></a>`;
  if (/\.(mp4|mov|webm)$/i.test(p)) return `<video controls playsinline preload="none" data-src="${u}#t=0.1"></video>`;
  return `<audio controls preload="none" src="${u}"></audio>`;
};

function stepHtml(s) {
  return `<li><code>${esc(s.tool)}</code>${s.model ? ` · ${esc(s.model)}` : ""}${s.resolution ? ` · ${esc(s.resolution)}` : ""} · ${s.credits ?? 0} cr · ${esc(s.state || "not run")}${s.seconds ? ` · ${s.seconds} s` : ""}${s.inputs?.length ? `<p>In: ${esc(s.inputs.join(", "))}</p>` : ""}${s.prompt ? `<p>${esc(s.prompt)}</p>` : ""}${s.why ? `<p>Why: ${esc(s.why)}</p>` : ""}${s.error ? `<p>Error: ${esc(s.error)}</p>` : ""}</li>`;
}

function sideHtml(r, k) {
  const x = r[k], won = r.verdict.winner === k;
  const problems = k === "agent" ? r.verdict.agent_problems : r.verdict.mcp_problems;
  const body = x.outputs.length
    ? `<div class="media">${x.outputs.map(media).join("")}</div>`
    : `<div class="none"><b>No file delivered</b>${esc(x.reply || "No reply recorded.")}</div>`;
  return `<div class="side side-${k} ${won ? "won" : ""}">
    <div class="sname"><span><i class="dot d-${k}"></i>${WHO[k]}</span>${won ? `<span class="won-tag">Winner</span>` : ""}</div>
    ${body}
    <div class="nums"><span><b>${x.pass ? "Pass" : "Fail"}</b> ${x.score}</span><span>${x.spent ?? 0} credits</span><span>${x.seconds ?? 0} s</span><span>${x.calls ?? 0} call${x.calls === 1 ? "" : "s"}</span>${x.questions ? `<span>${x.questions} question${x.questions > 1 ? "s" : ""}</span>` : ""}${x.denied ? `<span>${x.denied} refused by plan gate</span>` : ""}</div>
    ${x.models?.length ? `<div class="meta">${esc([...new Set(x.models)].join(", "))}</div>` : ""}
    ${x.summary ? `<p class="summary">${esc(x.summary)}</p>` : ""}
    ${x.tags?.length ? `<p class="tags">Grader flags: ${esc(x.tags.join(", "))}</p>` : ""}
    ${problems ? `<p class="complaint"><span>Judge's complaint:</span> ${esc(problems)}</p>` : ""}
    ${x.steps?.length || (x.outputs.length && x.reply) ? `<details><summary>${x.steps.length} step${x.steps.length === 1 ? "" : "s"} and reply</summary>${x.steps.length ? `<ul class="steps">${x.steps.map(stepHtml).join("")}</ul>` : ""}${x.outputs.length && x.reply ? `<p>${esc(x.reply)}</p>` : ""}</details>` : ""}
  </div>`;
}

function card(r) {
  const v = r.verdict, w = v.winner;
  const label = w === "tie" ? "Tie" : `${WHO[w]} wins`;
  const margin = v.margin && v.margin !== "none" ? ` · ${v.margin}` : "";
  const B = r.judgeA === "mcp" ? "agent" : "mcp";
  return `<article class="card">
    <div class="head"><span class="badge"><i class="dot d-${w}"></i>${label}${margin}</span><span class="title">${esc(r.title)}</span><span class="id">${r.id}</span><span class="meta">${esc(D.names[r.group])}${disagrees(r) ? " · judge and grader disagree" : ""}</span></div>
    <div class="prompt">${r.prompt.map((p, i) => `<div class="msg">${r.prompt.length > 1 ? `<span class="meta">Message ${i + 1}: </span>` : ""}${esc(p)}</div>`).join("")}${r.materials.length ? `<div class="atts">${r.materials.map((m) => m.src ? `<img src="${m.src}" alt="Attachment ${esc(m.name)}" title="${esc(m.name)}">` : `<span class="meta">${esc(m.name)}</span>`).join("")}</div>` : ""}</div>
    ${r.newer ? `<p class="flag">This compares the agent's earlier run. A later run exists in ${esc(r.newer.from)} (${r.newer.pass ? "pass" : "fail"}, score ${r.newer.score}), and no judge has compared it.</p>` : ""}
    <div class="sides">${sideHtml(r, "agent")}${sideHtml(r, "mcp")}</div>
    <p class="why">${esc(v.why)}${v.how === "judge" ? `<span class="key">In this note, A is the ${WHO[r.judgeA]} and B is the ${WHO[B]}. The judge saw them blind.</span>` : ""}</p>
  </article>`;
}

const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { const v = e.target; v.src = v.dataset.src; v.preload = "metadata"; io.unobserve(v); } }), { rootMargin: "600px" });

function list(rows) {
  const by = { id: () => 0, gap: (a, b) => Math.abs(b.agent.score - b.mcp.score) - Math.abs(a.agent.score - a.mcp.score), credits: (a, b) => (b.agent.spent + b.mcp.spent) - (a.agent.spent + a.mcp.spent) };
  const sorted = [...rows].sort(by[F.s]);
  $("list").innerHTML = sorted.length ? sorted.map(card).join("") : `<p class="empty">No items match these filters.</p>`;
  document.querySelectorAll("video[data-src]").forEach((v) => io.observe(v));
}

function writeHash() {
  const p = new URLSearchParams();
  for (const k in F) if (F[k] !== DEFAULT[k]) p.set(k, F[k] === true ? "1" : F[k]);
  const h = p.toString();
  history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  F = { ...DEFAULT };
  for (const [k, v] of p) if (k in F) F[k] = k === "x" ? v === "1" : v;
}

function update() {
  const rows = R.filter((r) => match(r));
  seg($("winner"), WIN, F.w, "w", (k) => R.filter((r) => match(r, "w") && (k === "all" || r.verdict.winner === k)).length);
  seg($("margin"), MARGIN, F.m, "m", (k) => R.filter((r) => match(r, "m") && (k === "all" || r.verdict.margin === k)).length);
  seg($("how"), HOW, F.h, "h", (k) => R.filter((r) => match(r, "h") && (k === "all" || r.verdict.how === k)).length);
  $("disagree").checked = F.x; $("q").value = F.q; $("sort").value = F.s;
  bars(); stats(rows); list(rows);
  $("showing").textContent = `Showing ${rows.length} of ${R.length}`;
  $("reset").style.display = JSON.stringify(F) === JSON.stringify(DEFAULT) ? "none" : "";
  writeHash();
}

$("disagree").onchange = (e) => { F.x = e.target.checked; update(); };
$("sort").onchange = (e) => { F.s = e.target.value; update(); };
let qt; $("q").oninput = (e) => { clearTimeout(qt); qt = setTimeout(() => { F.q = e.target.value.trim(); update(); }, 150); };
$("reset").onclick = () => { F = { ...DEFAULT }; update(); };
document.addEventListener("play", (e) => document.querySelectorAll("video,audio").forEach((m) => { if (m !== e.target) m.pause(); }), true);

const date = new Date(D.at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
$("sub").textContent = `The same ${R.length} prompts went to both sides on the free tier. Where both delivered, a judge compared the outputs blind and picked one.`;
$("foot").textContent = `Comparison built ${date}, from ${D.agentFrom.join(", ")} and ${D.mcpFrom.join(", ")}. Covers the micro tasks only, not the films.`;
readHash(); update();
</script>
</body>
</html>
