<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magic Agent</title>
<style>
/* Apple-like, fewer words: state is colour and an icon; inputs are pictures; prompts are file names; details are hidden. */
:root{--bg:#f5f5f7;--card:#fff;--fg:#1d1d1f;--mut:#86868b;--rule:#e5e5ea;--blue:#0a84ff;--grey:#eceef0;--ok:#34c759;--warn:#ff9f0a;--bad:#ff3b30;--inf:#eef4ff;--asm:#fff4e0;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--mut:#8e8e93;--rule:#2c2c2e;--grey:#2c2c2e;--inf:#14233a;--asm:#3a2a10;--shadow:0 1px 2px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);background:color-mix(in srgb,var(--bg) 75%,transparent);border-bottom:1px solid var(--rule);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.bar{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.bar .sp{flex:1}
.seg{display:inline-flex;background:var(--grey);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:var(--mut);font:12px/1 inherit;padding:5px 10px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);cursor:pointer;user-select:none;padding:5px 10px;border-radius:8px;background:var(--grey)}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block} .mode[data-m=auto] i{background:var(--ok)} .mode[data-m=plan] i{background:var(--mut)}
.mode b{color:var(--fg);font-weight:600;text-transform:capitalize} .mode kbd{font:10px/1 inherit;color:var(--mut);border:1px solid var(--rule);border-radius:4px;padding:1px 4px}
select,input[type=text],input[type=number]{font:inherit;font-size:12.5px;color:var(--fg);background:var(--grey);border:0;border-radius:6px;padding:4px 7px;outline:0;max-width:100%}
select:focus,input:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 35%,transparent)}
.ib{border:0;background:transparent;color:var(--mut);cursor:pointer;font:inherit;font-size:12px;padding:4px 8px;border-radius:6px} .ib:hover{background:var(--grey);color:var(--fg)}
main{max-width:820px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.msg{max-width:76%;padding:8px 13px;border-radius:17px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
.msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.msg.agent{align-self:flex-start;background:var(--grey);border-bottom-left-radius:5px}
.atts{align-self:flex-end;display:flex;gap:6px;margin-top:-4px}
.more{align-self:flex-start;margin:-6px 0 0 6px} .more summary{list-style:none;cursor:pointer;color:var(--mut);font-size:11.5px;padding:2px 8px;border-radius:6px} .more summary::-webkit-details-marker{display:none} .more summary:hover{background:var(--grey)}
.more .grid{margin:4px 0 0 8px}
.grid{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px} .grid span{display:inline-flex;gap:5px;align-items:baseline;white-space:nowrap} .grid span em{font-style:normal;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em} .grid span b{font-weight:500} .grid .inf b{background:var(--inf);border-radius:4px;padding:0 4px} .grid .asm b{background:var(--asm);border-radius:4px;padding:0 4px}
.card{align-self:stretch;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px 10px 14px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--blue);position:relative}
.card[data-s=paused]{border-left-color:var(--warn)} .card[data-s=approved]{border-left-color:var(--ok)} .card[data-s=skipped]{border-left-color:var(--rule);opacity:.55} .card[data-s=plan]{border-left-color:var(--mut)} .card[data-s=flagged]{border-left-color:var(--bad)}
.card .hd{display:flex;align-items:center;gap:8px} .card .hd b{font-size:14px;font-weight:600} .card .hd small{color:var(--mut);font-size:11.5px} .card .hd .st{margin-left:auto;font-size:14px;color:var(--mut)} .card[data-s=approved] .hd .st{color:var(--ok)} .card[data-s=paused] .hd .st{color:var(--warn)}
.io{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tile{width:64px;height:64px;border-radius:9px;background:var(--grey);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative;font-size:9.5px;color:var(--mut);text-align:center;padding:3px} .tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover} .tile span{position:relative;z-index:1;background:color-mix(in srgb,var(--card) 80%,transparent);border-radius:4px;padding:1px 4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.out{border:1.5px dashed var(--rule);background:transparent} .io .arrow{color:var(--mut);padding:0 2px}
.pg{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12.5px} .pg label{display:inline-flex;align-items:center;gap:5px;white-space:nowrap} .pg label em{font-style:normal;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em} .pg input[type=number]{width:58px} .pg .file{color:var(--blue);cursor:pointer;background:var(--inf);border-radius:6px;padding:3px 8px;font-size:12px}
.card .pr{display:none;white-space:pre-wrap;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--grey);border-radius:8px;padding:8px} .card .pr[open]{display:block} .card textarea.pr{display:block;width:100%;border:0;resize:vertical;min-height:60px;color:var(--fg)}
.ft{display:flex;align-items:center;gap:2px} .ft .cost{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums;margin-right:auto} .ft .cost b{color:var(--fg);font-weight:500}
.ft button{border:0;background:transparent;width:30px;height:28px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--mut)} .ft button:hover{background:var(--grey);color:var(--fg)} .ft button.run{color:var(--blue)} .ft button:disabled{opacity:.3;cursor:default}
.est{align-self:flex-start;font-size:11.5px;color:var(--mut);margin:-2px 0 0 6px}
form.ask{position:fixed;bottom:0;left:0;right:0;padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);background:color-mix(in srgb,var(--bg) 75%,transparent);border-top:1px solid var(--rule)}
form.ask .row{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
form.ask textarea{flex:1;min-height:38px;max-height:160px;resize:none;background:var(--card);border:0;border-radius:19px;padding:9px 14px;box-shadow:var(--shadow);font:inherit;font-size:14.5px;color:var(--fg);outline:0}
form.ask .att{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);border:0;font-size:16px;cursor:pointer;color:var(--mut)} form.ask .send{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;border:0;font-size:17px;cursor:pointer}
.pend{max-width:820px;margin:0 auto 6px;display:flex;gap:6px;flex-wrap:wrap} .pend .tile{width:44px;height:44px;font-size:8.5px}
.view{align-self:stretch;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.view h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px} .view h2 small{color:var(--mut);font-weight:400;font-size:12px}
.story p{margin:0 0 .7em;max-width:64ch;font-size:14px}
.scene{border:1px solid var(--rule);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:5px} .scene .t{display:flex;gap:8px;align-items:baseline} .scene .t b{font-weight:600;font-size:13px} .scene .t small{color:var(--mut);font-size:11.5px} .scene .t .cm{margin-left:auto}
.scene .syn{font-size:13px} .shot{display:grid;grid-template-columns:44px 1fr;gap:6px;font-size:12.5px;padding:4px 0;border-top:1px solid var(--rule)} .shot .n{color:var(--mut);font-variant-numeric:tabular-nums} .shot .ln{color:var(--mut);font-style:italic}
.cmt{display:none;gap:6px;margin-top:3px} .cmt.open{display:flex} .cmt input{flex:1} .note{font-size:12px;color:var(--blue);background:var(--inf);border-radius:7px;padding:4px 8px;align-self:flex-start}
.slides img,.slides video{width:100%;border-radius:10px;background:#000;aspect-ratio:16/9;object-fit:contain;display:block}
.nav{display:flex;align-items:center;gap:4px;margin-top:6px} .nav .cap{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;margin-right:auto} .nav .v{width:8px;height:8px;border-radius:50%;background:var(--mut)} .nav .v.accepted{background:var(--ok)} .nav .v.flagged{background:var(--bad)}
.thumbs{display:flex;gap:5px;overflow-x:auto;padding:2px 0} .thumbs img{height:42px;border-radius:5px;cursor:pointer;opacity:.55;border:2px solid transparent} .thumbs img.on{opacity:1;border-color:var(--blue)}
.hint{color:var(--mut);font-size:13px;text-align:center;padding:40px 0 0}
@media(max-width:600px){.msg{max-width:92%}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>Magic Agent</h1>
  <span class="seg" id="tier"><button data-t="free" aria-pressed="true">Free</button><button data-t="cheap">Cheap</button><button data-t="paid">Paid</button></span>
  <span class="mode" id="mode" data-m="ask" title="Shift+Tab cycles: ask · auto · plan"><i></i><b>ask</b><kbd>⇧⇥</kbd></span>
  <span class="sp"></span>
  <select id="runpick" title="Open a run"><option value="">Runs…</option></select>
  <button class="ib" id="reset" title="New chat">＋</button>
</div></header>
<main id="chat"><p class="hint">Say what you want made. ＋ attaches files.</p></main>
<form class="ask" id="ask"><div class="pend" id="pend"></div><div class="row">
  <button class="att" type="button" id="attach" title="Attach files">＋</button><input type="file" id="files" multiple hidden>
  <textarea id="text" placeholder="Message" rows="1"></textarea>
  <button class="send" type="submit" aria-label="Send">↑</button>
</div></form>
<script>
const $ = (s, r = document) => r.querySelector(s), chat = $("#chat");
const esc = (x) => String(x ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const SID = "default"; let S = null, MODELS = null; const MODES = ["ask", "auto", "plan"]; const pending = [];
const api = async (p, b) => (await fetch(p, b ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(b) } : undefined)).json();
const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const add = (n) => { chat.appendChild(n); n.scrollIntoView({ block: "end", behavior: "smooth" }); return n; };
const tier = () => $("#tier [aria-pressed=true]").dataset.t, mode = () => $("#mode").dataset.m;
const isImg = (n) => /\.(png|jpe?g|webp|gif)$/i.test(n), isVid = (n) => /\.(mp4|mov)$/i.test(n);
const matUrl = (n) => (S?.materials || []).includes(n) ? `/sessions/${SID}/materials/${encodeURIComponent(n)}` : null;
const tile = (name, out = false) => { const u = matUrl(name); return `<div class="tile${out ? " out" : ""}" title="${esc(name)}">${u && isImg(name) ? `<img src="${u}" alt="">` : u && isVid(name) ? `<video src="${u}" muted></video>` : ""}<span>${esc(name)}</span></div>`; };

function grid(sheet) {
  const cell = (k, v, s) => `<span class="${s === "inferred" ? "inf" : s === "assumed" ? "asm" : ""}"><em>${esc(k)}</em><b>${esc(v)}</b></span>`;
  return [cell("goal", sheet.goal.value, sheet.goal.source), ...sheet.fields.filter((f) => f.source !== "not_applicable" && f.value).map((f) => cell(f.field, f.value, f.source))].join("");
}
const kindOf = (m, tool) => MODELS.stills[m] ? "still" : MODELS.videos[m] ? "video" : /^(film|podcast|edit-run)$/.test(tool) ? "pipeline" : "none";
function costOf(step, m, r, sec) { const s = MODELS.stills[m], v = MODELS.videos[m]; if (s) return s.cost?.[r] ?? Object.values(s.cost || {})[0] ?? 0; if (v) return (Number(sec) || 5) * (v.cost?.[r] ?? Object.values(v.cost || {})[0] ?? 24); return step.credits || 0; }
const ICON = { proposed: "", paused: "⏸", approved: "✓", skipped: "", plan: "", flagged: "!" };

function card(step, i, ti) {
  const kind = kindOf(step.model, step.tool); const table = kind === "still" ? MODELS.stills : MODELS.videos;
  const c = el(`<div class="card" data-s="${esc(step.state)}">
    <div class="hd"><b>${esc(step.tool.replace(/-/g, " "))}</b><small>${esc(step.group.replace("-", " "))}</small><span class="st">${ICON[step.state] || ""}</span></div>
    <div class="io">${step.inputs.map((x) => tile(x)).join("")}${step.inputs.length ? `<span class="arrow">→</span>` : ""}${tile(step.produces, true)}</div>
    <div class="pg">
      ${kind === "still" || kind === "video" ? `<label><em>model</em><select data-k="model">${Object.entries(table).map(([n, m]) => `<option value="${n}"${n === step.model ? " selected" : ""}>${n}</option>`).join("")}</select></label><label><em>res</em><select data-k="resolution">${(table[step.model]?.resolutions || []).map((r) => `<option${r === step.resolution ? " selected" : ""}>${r}</option>`).join("")}</select></label>` : kind === "pipeline" ? `<label><em>models</em>${esc(step.model)}</label>` : ""}
      ${kind === "video" || step.params.seconds ? `<label><em>s</em><input type="number" data-k="seconds" min="1" max="60" value="${esc(step.params.seconds || 5)}"></label>` : ""}
      ${kind !== "none" ? `<label><em>aspect</em><select data-k="aspect">${["", "16:9", "9:16", "1:1", "4:5"].map((a) => `<option value="${a}"${a === (step.params.aspect || "") ? " selected" : ""}>${a || "auto"}</option>`).join("")}</select></label>` : ""}
      ${step.params.extra ? `<label><em>+</em><input type="text" data-k="extra" value="${esc(step.params.extra)}" size="${Math.min(28, step.params.extra.length + 2)}"></label>` : ""}
      <span class="file" data-pr title="open the prompt">${esc(step.prompt_file || "prompt")}</span>
    </div>
    <textarea class="pr" data-k="prompt_or_change" hidden>${esc(step.params.prompt_or_change)}</textarea>
    <div class="ft"><span class="cost"><b data-cost>${step.credits}</b> cr${step.needs_beyond_free ? ` · ${esc(step.needs_beyond_free)}` : ""}</span>
      <button data-a="skipped" title="Skip">✕</button><button data-a="paused" title="Pause">⏸</button><button class="run" data-a="approved" title="Run">▶</button></div>
  </div>`);
  const ta = c.querySelector("textarea.pr"); c.querySelector("[data-pr]").addEventListener("click", () => (ta.hidden = !ta.hidden));
  const recost = () => { const m = c.querySelector('[data-k="model"]')?.value || step.model, r = c.querySelector('[data-k="resolution"]')?.value || step.resolution, s = c.querySelector('[data-k="seconds"]')?.value; c.querySelector("[data-cost]").textContent = costOf(step, m, r, s); };
  c.querySelector('[data-k="model"]')?.addEventListener("change", (e) => { const t2 = MODELS.stills[e.target.value] || MODELS.videos[e.target.value]; c.querySelector('[data-k="resolution"]').innerHTML = (t2?.resolutions || []).map((r) => `<option>${r}</option>`).join(""); recost(); });
  c.querySelectorAll("[data-k]").forEach((x) => x.addEventListener("input", recost));
  const lock = () => { const done = step.state === "approved" || step.state === "skipped" || step.state === "plan"; c.querySelectorAll("[data-a]").forEach((x) => (x.disabled = done)); c.querySelector('[data-a="paused"]').textContent = step.state === "paused" ? "▶" : "⏸"; c.querySelector('[data-a="paused"]').title = step.state === "paused" ? "Resume" : "Pause"; };
  c.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", async () => {
    const params = {}; c.querySelectorAll("[data-k]").forEach((x) => { if (x.dataset.k === "seconds") params.seconds = Number(x.value); else if (x.dataset.k !== "model") params[x.dataset.k] = x.value; });
    const state = b.dataset.a === "paused" && step.state === "paused" ? "proposed" : b.dataset.a;
    const r = await api(`/session/${SID}/step`, { turn: ti, index: i, params, model: c.querySelector('[data-k="model"]')?.value, resolution: c.querySelector('[data-k="resolution"]')?.value, credits: Number(c.querySelector("[data-cost]").textContent), state });
    step.state = r.step.state; c.dataset.s = step.state; c.querySelector(".st").textContent = ICON[step.state] || ""; lock();
    const est = c.parentElement.querySelector(`.est[data-t="${ti}"]`); if (est) est.querySelector("b").textContent = r.estimate;
  }));
  lock(); return c;
}

function renderTurn(t, ti, text) {
  add(el(`<div class="msg agent">${esc(text)}</div>`));
  add(el(`<details class="more"><summary>details</summary><div class="grid">${grid(t.sheet)}</div></details>`));
  if (t.plan) { t.plan.steps.forEach((s, i) => add(card(s, i, ti))); add(el(`<div class="est" data-t="${ti}">~<b>${t.plan.estimate_credits}</b> cr · ${esc(t.plan.tier)}${t.plan.refuse ? ` · declined: ${esc(t.plan.refuse)}` : ""}</div>`)); }
}

async function send(text, names) {
  add(el(`<div class="msg user">${esc(text)}</div>`)); if (names.length) add(el(`<div class="atts">${names.map((n) => tile(n)).join("")}</div>`));
  const typing = add(el(`<div class="msg agent" style="color:var(--mut)">…</div>`));
  const r = await api("/turn", { session: SID, text, materials: names, tier: tier(), mode: mode() });
  typing.remove(); if (r.error) return add(el(`<div class="msg agent">${esc(r.error)}</div>`));
  S = r.session; renderTurn(r.turn, r.turnIndex, r.text);
}

// attachments: uploaded on pick, shown as tiles under the box, attached to the next message
$("#attach").addEventListener("click", () => $("#files").click());
$("#files").addEventListener("change", async (e) => { for (const f of e.target.files) { const r = await (await fetch(`/upload?session=${SID}&name=${encodeURIComponent(f.name)}`, { method: "POST", body: f })).json(); S = S || {}; S.materials = [...new Set([...(S.materials || []), r.name])]; pending.push(r.name); $("#pend").appendChild(el(tile(r.name))); } e.target.value = ""; });
$("#ask").addEventListener("submit", (e) => { e.preventDefault(); const t = $("#text").value.trim(); if (!t && !pending.length) return; $("#text").value = ""; chat.querySelector(".hint")?.remove(); const names = pending.splice(0); $("#pend").innerHTML = ""; send(t || "(files)", names); });
$("#text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#ask").requestSubmit(); } });
$("#tier").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; $("#tier").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); });
const setMode = (m) => { const n = $("#mode"); n.dataset.m = m; n.querySelector("b").textContent = m; };
document.addEventListener("keydown", (e) => { if (e.key === "Tab" && e.shiftKey) { e.preventDefault(); setMode(MODES[(MODES.indexOf(mode()) + 1) % MODES.length]); } });
$("#mode").addEventListener("click", () => setMode(MODES[(MODES.indexOf(mode()) + 1) % MODES.length]));
$("#reset").addEventListener("click", async () => { S = await api("/session/reset", { session: SID, mode: mode() }); chat.innerHTML = '<p class="hint">New chat.</p>'; });

// ----- views over a run -----
async function showRun(label) {
  const R = await api(`/run/${encodeURIComponent(label)}`); if (R.error) return; const media = (p) => `/media/${encodeURIComponent(label)}/${p}`;
  add(el(`<div class="msg user">${esc(label)}</div>`));
  const st = R.story || {}; add(el(`<div class="view story"><h2>${esc(st.title || label)}<small>${esc(st.kind || "")} · ${esc(R.mode)}</small></h2>${(st.story || "").split(/\n\n+/).map((p) => `<p>${esc(p)}</p>`).join("")}</div>`));
  const v = el(`<div class="view"><h2>Screenplay<small>${esc(R.script?.theme || "")}</small></h2></div>`);
  for (const s of R.script?.scenes || []) {
    const notes = (R.notes.comments || []).filter((c) => c.scene === s.n);
    const b = el(`<div class="scene"><div class="t"><b>${s.n}</b><small>${esc(s.place)}${s.time ? ` · ${esc(s.time)}` : ""}${s.seconds ? ` · ${s.seconds}s` : ""}${s.tone ? ` · ${esc(s.tone)}` : ""}</small><button class="ib cm" title="Comment">💬</button></div><div class="syn">${esc(s.synopsis || s.situation || "")}</div>
      ${(s.shots || []).map((sh) => `<div class="shot"><span class="n">${sh.n}${sh.seconds ? `·${sh.seconds}s` : ""}</span><span>${esc(sh.moment || sh.action || "")}${(sh.lines || []).length ? `<br><span class="ln">${sh.lines.map((l) => esc(typeof l === "string" ? l : `${l.who || l.speaker || ""}: ${l.text || l.line || ""}`)).join(" / ")}</span>` : ""}</span></div>`).join("")}
      ${notes.map((n) => `<div class="note">${esc(n.text)}</div>`).join("")}<div class="cmt"><input type="text" placeholder="Comment"><button class="ib">↑</button></div></div>`);
    b.querySelector(".cm").addEventListener("click", () => b.querySelector(".cmt").classList.toggle("open"));
    b.querySelector(".cmt button").addEventListener("click", async () => { const inp = b.querySelector(".cmt input"); if (!inp.value.trim()) return; await api(`/run/${encodeURIComponent(label)}/comment`, { scene: s.n, text: inp.value.trim() }); b.insertBefore(el(`<div class="note">${esc(inp.value.trim())}</div>`), b.querySelector(".cmt")); add(el(`<div class="msg user">${s.n}: ${esc(inp.value.trim())}</div>`)); inp.value = ""; b.querySelector(".cmt").classList.remove("open"); });
    v.appendChild(b);
  }
  add(v);
  const stills = R.stills.filter((s) => s.file); if (!stills.length) return; let i = 0, att = null;
  const k = el(`<div class="view"><h2>Keyframes</h2><div class="slides"><img></div><div class="nav"><span class="cap"></span><span class="v"></span><button class="ib" data-n="-1">‹</button><button class="ib" data-n="1">›</button><button class="ib" data-pr title="prompt">¶</button><button class="ib" data-flag title="Looks wrong" style="color:var(--bad)">⚑</button></div><div class="thumbs"></div><pre class="pr" style="display:none;white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--grey);border-radius:8px;padding:8px;max-height:240px;overflow:auto"></pre></div>`);
  const draw = () => { const s = stills[i]; const file = att ?? s.file; k.querySelector("img").src = media(file); k.querySelector(".cap").textContent = `${i + 1}/${stills.length} · ${s.id} · ${s.size}${att ? ` · ${att.split("/").pop()}` : ""}`; k.querySelector(".v").className = `v ${s.gate || ""}`; k.querySelector(".v").title = s.gate || ""; k.querySelector(".thumbs").innerHTML = s.attempts.map((a) => `<img src="${media(a)}" class="${(att ?? s.file) === a ? "on" : ""}" data-a="${a}">`).join(""); k.querySelector("pre").textContent = `${s.inputs.length ? "images: " + s.inputs.join(", ") + "\n\n" : ""}${s.prompt}`; k.querySelectorAll(".note").forEach((n) => n.remove()); for (const f of (R.notes.flags || []).filter((f) => f.still === s.id)) k.querySelector(".thumbs").after(el(`<div class="note">${esc(f.text)}</div>`)); };
  k.querySelectorAll("[data-n]").forEach((b) => b.addEventListener("click", () => { i = (i + Number(b.dataset.n) + stills.length) % stills.length; att = null; draw(); }));
  k.querySelector("[data-pr]").addEventListener("click", () => { const p = k.querySelector("pre"); p.style.display = p.style.display === "none" ? "block" : "none"; });
  k.querySelector(".thumbs").addEventListener("click", (e) => { if (e.target.dataset.a) { att = e.target.dataset.a; draw(); } });
  k.querySelector("[data-flag]").addEventListener("click", async () => { const s = stills[i]; const text = prompt(`${s.id}: what looks wrong?`); if (!text) return; await api(`/run/${encodeURIComponent(label)}/flag`, { still: s.id, file: att ?? s.file, text }); R.notes.flags.push({ still: s.id, text }); draw(); add(el(`<div class="msg user">${esc(s.id)}: ${esc(text)}</div>`)); });
  document.addEventListener("keydown", (e) => { if (!k.isConnected || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return; if (e.key === "ArrowLeft") k.querySelector('[data-n="-1"]').click(); if (e.key === "ArrowRight") k.querySelector('[data-n="1"]').click(); });
  draw(); add(k);
  if (R.film) add(el(`<div class="view"><h2>Film</h2><div class="slides"><video controls src="${media(R.film)}"></video></div></div>`));
}
$("#runpick").addEventListener("change", (e) => { if (e.target.value) { chat.querySelector(".hint")?.remove(); showRun(e.target.value); e.target.value = ""; } });

(async () => {
  MODELS = await api("/models");
  for (const r of await api("/runs")) $("#runpick").appendChild(el(`<option value="${esc(r.label)}">${esc(r.label)}</option>`));
  S = await api(`/session/${SID}`); setMode(S.mode || "ask"); $("#tier").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.t === (S.tier || "free")));
  if (S.messages?.length) { chat.innerHTML = ""; for (const m of S.messages) { if (m.who === "user") add(el(`<div class="msg user">${esc(m.text)}</div>`)); else if (m.who === "agent" && S.turns[m.turn]) renderTurn(S.turns[m.turn], m.turn, m.text); } }
})();
</script>
</body>
</html>
